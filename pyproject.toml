[project]
name = "python-cookbook-notes"
version = "0.1.0"
description = "Paired executable Python and TypeScript notes for Modern Python Cookbook"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "ruff>=0.14.0",
    "ty==0.0.93",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = [
    "E4",
    "E7",
    "E9",
    "F",
    "I",
    "B",
    "UP",
    "SIM",
    "RUF",
]

[tool.ruff.format]
docstring-code-format = true

[tool.ty.src]
include = ["chapter-*"]
